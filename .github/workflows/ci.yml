name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[api]" ruff pytest

      - name: Lint
        run: ruff check .

      # The two tests that reach OpenBB and Yahoo are marked `network` and are
      # deselected by the default addopts, so a failure here is a real failure
      # rather than a flaky runner.
      - name: Tests
        run: pytest -q
