[pytest]
testpaths = tests
python_files = test_*.py
python_functions = test_*
addopts = -v --tb=short -m "not network"
norecursedirs = .* node_modules __pycache__ *.egg-info data .chroma reports scripts .venv references logs
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests requiring API keys or network access
    network: marks tests that make live network calls (deselected by default; run with '-m network')
